<style>
:root{
  --ink:#0d1520; --ink2:#16212f; --ink3:#1e2c3d;
  --paper:#f7f9fb; --card:#ffffff; --line:#e2e8f0;
  --text:#16212f; --mut:#5b6b7f; --mut2:#8195a9;
  --cy:#0e9aa7; --cy-d:#0b7c87; --cy-l:#25c9d0;
  --amb:#e8892b; --grn:#1f9d55; --red:#c0392b;
  --fb:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  /* MOTION TOKENS — every duration and curve on this page comes from here.
     Entrances use ease-out (fast start, soft landing) because the element is
     arriving and the eye should catch it immediately. Exits use ease-in.
     Nothing uses the browser default `ease`, which is the single clearest
     tell of a template: it eases IN as well as out, so every entrance starts
     slowly and reads as hesitant. */
  --e-out:cubic-bezier(.16,1,.3,1);        /* arrivals, reveals */
  --e-in:cubic-bezier(.7,0,.84,0);         /* dismissals */
  --e-soft:cubic-bezier(.4,0,.2,1);        /* state changes both ways */
  --e-pop:cubic-bezier(.2,1.25,.4,1);      /* a small, deliberate overshoot */
  --t-tap:60ms;    /* press DOWN. Asymmetric on purpose: the state you asked
                      for arrives almost instantly, the state you abandoned
                      decays visibly. Instant in both directions reads as a
                      broken toggle rather than as speed. */
  --t-rel:150ms;   /* press RELEASE */
  --t-fast:160ms;  /* hover, colour, small transforms */
  --t-mid:280ms;   /* a card, a panel */
  --t-slow:320ms;  /* a section arriving on scroll. NOT 700ms: with an
                      ease-out curve 90% of the travel is done by 39% of
                      the duration, so the rest is dead time during which
                      the text is still not fully opaque and cannot be read. */
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--paper);color:var(--text);
  line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- status band ---------- */
.band{background:var(--ink);color:#cfe0ee;font-size:.8rem;padding:.5rem 0;
  border-bottom:1px solid rgba(255,255,255,.07)}
.band .wrap{display:flex;gap:.9rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.band b{color:#fff}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:.45rem;
  background:var(--mut2);vertical-align:middle}
.dot.on{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.16)}
.dot.off{background:#ef7d6b}
.band .addr{color:#8fa6bd}

/* ---------- nav ---------- */
nav:not(.sticky){position:sticky;top:0;z-index:50;background:rgba(247,249,251,.9);
  border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(1px)){
  /* blur only where it is cheap: a 1px-tall bar. A large blurred surface is
     one of the few CSS properties that reliably costs frames on a mid-range
     Android, so it stays off everything else on this page. */
  nav:not(.sticky){backdrop-filter:saturate(1.4) blur(10px)}
}
nav:not(.sticky) .wrap{display:flex;align-items:center;gap:1rem;height:64px}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;letter-spacing:-.02em;
  text-decoration:none;font-size:1.05rem}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--ink);
  display:grid;place-items:center;flex:none}
.logo .mark svg{width:16px;height:16px}
.logo small{display:block;font-size:.62rem;letter-spacing:.14em;color:var(--mut);
  font-weight:700;text-transform:uppercase}
.navlinks{display:none;gap:1.4rem;margin-left:auto;font-size:.92rem;font-weight:600}
.navlinks a{text-decoration:none;color:var(--mut);transition:color var(--t-fast) var(--e-soft)}
.navlinks a:hover{color:var(--cy-d)}
.navcta{margin-left:auto;display:flex;gap:.5rem}
@media(min-width:900px){.navlinks{display:flex}.navcta{margin-left:1.4rem}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.78rem 1.25rem;border-radius:11px;font-weight:700;font-size:.95rem;
  text-decoration:none;border:0;cursor:pointer;font-family:inherit;
  transition:transform var(--t-rel) var(--e-out), background var(--t-fast) var(--e-soft),
             box-shadow var(--t-rel) var(--e-soft), color var(--t-fast) var(--e-soft)}
.btn:active{transition-duration:var(--t-tap)}
.btn svg{width:17px;height:17px;flex:none}
.btn-p{background:var(--cy);color:#fff;box-shadow:0 2px 0 var(--cy-d)}
.btn-p:hover{background:var(--cy-d)}
/* Press is faster than release and moves the button DOWN onto its own shadow.
   The shadow shrinking is what sells it as a physical key rather than a
   rectangle that changed colour. */
.btn-p:active{transform:translateY(2px);box-shadow:0 0 0 var(--cy-d)}
.btn-s{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
.btn-s:hover{border-color:var(--cy);color:var(--cy-d)}
.btn-s:active{transform:translateY(1px)}
.btn-g{background:#fff;color:var(--ink);box-shadow:0 2px 0 #cfd8e3}
.btn-g:active{transform:translateY(2px);box-shadow:0 0 0 #cfd8e3}
.btn-sm{padding:.5rem .85rem;font-size:.85rem;border-radius:9px}
:focus-visible{outline:3px solid var(--cy-l);outline-offset:3px;border-radius:6px}

/* ---------- hero ---------- */
.hero{background:
    radial-gradient(90rem 40rem at 78% -8%, rgba(37,201,208,.16), transparent 60%),
    radial-gradient(60rem 30rem at 8% 110%, rgba(232,137,43,.10), transparent 60%),
    var(--ink);
  color:#fff;padding:clamp(3rem,8vw,5.5rem) 0 clamp(2.6rem,6vw,4rem);position:relative;
  overflow:hidden}
.hero .wrap{position:relative;z-index:2;display:grid;gap:clamp(2rem,5vw,3.5rem)}
@media(min-width:940px){.hero .wrap{grid-template-columns:1.35fr .85fr;align-items:center}}
.eyebrow{font-size:.68rem;letter-spacing:.17em;font-weight:800;color:var(--cy-l);
  text-transform:uppercase;margin-bottom:1rem}
h1{font-size:clamp(2.5rem,7.5vw,4.4rem);line-height:.99;letter-spacing:-.035em;
  font-weight:850;margin-bottom:1.15rem}
h1 .lo{display:block;color:#93a9c0;font-weight:800}
h1 .hi{display:block;color:var(--cy-l)}
.hero p.sub{font-size:clamp(1rem,2.1vw,1.16rem);color:#b9cadb;max-width:34rem;margin-bottom:1.7rem}
.hero .acts{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1.4rem}
.hero .proof{font-size:.82rem;color:#7f95ad;letter-spacing:.02em}

/* rating card */
.rate{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);
  border-radius:18px;padding:clamp(1.4rem,3vw,2rem);text-align:center;
  transition:border-color var(--t-mid) var(--e-soft), background var(--t-mid) var(--e-soft)}
.rate:hover{border-color:rgba(37,201,208,.4);background:rgba(255,255,255,.07)}
.rate .n{font-size:3.4rem;font-weight:850;color:var(--cy-l);line-height:1;letter-spacing:-.03em}
.rate .st{color:#f0b429;font-size:1.05rem;letter-spacing:.16em;margin:.5rem 0 .35rem}
.rate .c{font-weight:700;font-size:.95rem;color:#fff}
.rate .c a{color:#fff}
.rate .m{font-size:.72rem;color:#7f95ad;margin-top:.3rem;line-height:1.4}
.rate blockquote{margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid rgba(255,255,255,.11);
  font-style:italic;color:#cfe0ee;font-size:.92rem}
.rate cite{display:block;font-style:normal;color:#7f95ad;font-size:.78rem;margin-top:.5rem}

/* ---------- section shell ---------- */
section{padding:clamp(2.8rem,7vw,4.6rem) 0}
.sec-h{max-width:44rem;margin-bottom:clamp(1.6rem,4vw,2.4rem)}
h2{font-size:clamp(1.6rem,4vw,2.35rem);letter-spacing:-.028em;line-height:1.1;
  font-weight:850;margin-bottom:.6rem}
.sec-h p{color:var(--mut);font-size:1.02rem}
.tag{display:inline-block;font-size:.66rem;letter-spacing:.15em;font-weight:800;
  color:var(--cy-d);text-transform:uppercase;margin-bottom:.65rem}

/* ---------- cards grid ---------- */
.grid{display:grid;gap:.85rem}
@media(min-width:640px){.grid.c2{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.grid.c3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:1.15rem 1.25rem;
  transition:transform var(--t-mid) var(--e-out), box-shadow var(--t-mid) var(--e-out),
             border-color var(--t-mid) var(--e-soft)}
@media(hover:hover){
  /* hover only where a pointer exists. On touch, :hover latches on after a tap
     and leaves a card stuck in its raised state until you tap elsewhere. */
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px -14px rgba(13,21,32,.35);
    border-color:#cbd7e4}
}
.card h3{font-size:1.03rem;font-weight:750;letter-spacing:-.01em;margin-bottom:.28rem;
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.card p{color:var(--mut);font-size:.9rem}
.card .price{margin-top:.7rem;font-weight:750;color:var(--cy-d);font-size:.9rem}
.pill{font-size:.6rem;letter-spacing:.11em;font-weight:800;text-transform:uppercase;
  background:#e6f7f8;color:var(--cy-d);padding:.2rem .5rem;border-radius:99px}

/* ---------- repair strip ---------- */
.repair{background:var(--ink2);color:#fff}
.repair h2{color:#fff}
.repair .sec-h p{color:#a8bccf}
.repair .tag{color:var(--cy-l)}
.repair .card{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.1)}
.repair .card h3{color:#fff}
.repair .card p{color:#a8bccf}
.repair .card .price{color:var(--cy-l)}
.repair .pill{background:rgba(37,201,208,.16);color:var(--cy-l)}
@media(hover:hover){.repair .card:hover{border-color:rgba(37,201,208,.42);
  box-shadow:0 12px 30px -18px rgba(0,0,0,.7)}}
.repair .foot{margin-top:1.3rem;color:#8fa6bd;font-size:.88rem}

/* ---------- policy ---------- */
.policy{background:linear-gradient(180deg,#fff,#f0f6f7);
  border:1px solid #cfe6e9;border-radius:20px;padding:clamp(1.5rem,4vw,2.5rem);
  display:grid;gap:1.4rem}
@media(min-width:820px){.policy{grid-template-columns:1.1fr .9fr;align-items:center}}
.policy h2{margin-bottom:.7rem}
.policy .body{color:var(--mut);font-size:1.02rem;margin-bottom:1rem}
.policy ul{list-style:none;display:grid;gap:.6rem}
.policy li{display:flex;gap:.65rem;align-items:flex-start;font-size:.94rem;font-weight:600}
.policy li svg{width:19px;height:19px;flex:none;color:var(--grn);margin-top:.12rem}
.policy .fine{font-size:.83rem;color:var(--mut2);margin-top:1rem}

/* ---------- offer ---------- */
.offer{background:var(--ink);color:#fff;border-radius:20px;
  padding:clamp(1.5rem,4vw,2.4rem);display:flex;gap:1.4rem;align-items:center;
  flex-wrap:wrap;justify-content:space-between;
  background-image:radial-gradient(40rem 20rem at 100% 0%, rgba(232,137,43,.22), transparent 62%)}
.offer h2{color:#fff;font-size:clamp(1.4rem,3.4vw,1.9rem);margin:0}
.offer p{color:#b9cadb;font-size:.96rem;margin-top:.4rem}
.offer .fine{color:#7f95ad;font-size:.78rem;margin-top:.5rem}
.offer .pct{font-size:clamp(2.6rem,7vw,3.6rem);font-weight:850;color:var(--amb);
  line-height:1;letter-spacing:-.03em}

/* ---------- finding ---------- */
.route{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem}
.route h3{font-size:.98rem;font-weight:750;margin-bottom:.3rem}
.route h3 b{color:var(--cy-d)}
.route p{color:var(--mut);font-size:.9rem}
.hedge{color:var(--mut2);font-size:.85rem;margin-top:1rem}

/* ---------- faq ---------- */
.faq{border-top:1px solid var(--line)}
.faq .q{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:1.05rem .2rem;font-family:inherit;font-size:1rem;font-weight:700;color:var(--text);
  cursor:pointer;display:flex;justify-content:space-between;gap:1rem;align-items:center;
  transition:color var(--t-fast) var(--e-soft)}
.faq .q:hover{color:var(--cy-d)}
.faq .q .chev{flex:none;width:20px;height:20px;color:var(--mut2);
  transition:transform var(--t-mid) var(--e-out), color var(--t-fast) var(--e-soft)}
.faq .q[aria-expanded="true"] .chev{transform:rotate(180deg);color:var(--cy-d)}
.faq .a{color:var(--mut);font-size:.95rem;padding:0 .2rem 1.1rem;
  border-bottom:1px solid var(--line);max-width:52rem}

/* ---------- reviews ---------- */
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.25rem}
.rev p{font-size:.95rem;font-style:italic;color:var(--text)}
.rev cite{display:block;font-style:normal;color:var(--mut2);font-size:.82rem;margin-top:.8rem;font-weight:600}
.rev .st{color:#f0b429;letter-spacing:.14em;font-size:.9rem;margin-bottom:.6rem}

/* ---------- footer ---------- */
footer{background:var(--ink);color:#93a9c0;padding:clamp(2.4rem,6vw,3.4rem) 0 6.5rem;font-size:.9rem}
footer .cols{display:grid;gap:1.6rem;margin-bottom:1.8rem}
@media(min-width:760px){footer .cols{grid-template-columns:1.3fr 1fr 1fr}}
footer h4{color:#fff;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:.7rem;font-weight:800}
footer a{color:#b9cadb;text-decoration:none;transition:color var(--t-fast) var(--e-soft)}
footer a:hover{color:var(--cy-l)}
footer .li{display:block;margin-bottom:.35rem}
footer .base{border-top:1px solid rgba(255,255,255,.09);padding-top:1.3rem;
  display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:#6d8399}
@media(min-width:760px){footer{padding-bottom:3.4rem}}

/* ---------- sticky mobile bar ---------- */
/* top:auto acikca yaziliyor: bir gun baska bir kural yine `nav` uzerinden
   top verirse, bottom:0 ile birleserek bu cubugu tekrar tam ekran yapar. */
.sticky{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;display:flex;
  background:var(--ink2);border-top:1px solid rgba(255,255,255,.1);
  padding:.55rem .7rem calc(.55rem + env(safe-area-inset-bottom))}
.sticky a{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;
  padding:.4rem;color:#b9cadb;text-decoration:none;font-size:.72rem;font-weight:700;
  border-radius:10px;transition:background var(--t-fast) var(--e-soft),
    color var(--t-fast) var(--e-soft), transform var(--t-tap) var(--e-out)}
.sticky a:active{transform:scale(.94)}
.sticky a svg{width:19px;height:19px}
.sticky a.main{background:var(--cy);color:#fff}
@media(min-width:760px){.sticky{display:none}}

/* ---------- scroll reveal ----------
   Reveals are opt-IN per section and only ever move 14px. Large-area motion
   is a vestibular trigger, and a 40px slide on every block is the thing that
   makes a site feel like it is fighting the reader. */
/* Scoped to .js, set by an inline script before the first paint. Without
   that scope, a visitor whose JS failed - or a crawler that does not run
   IntersectionObserver - gets a page whose content is permanently at
   opacity 0. A reveal animation must never be the thing standing between a
   customer and the shop's phone number. */
.js .rv{opacity:0;transform:translateY(14px)}
.js .rv.in{opacity:1;transform:none;
  transition:opacity var(--t-slow) var(--e-out) var(--d,0ms),
             transform var(--t-slow) var(--e-out) var(--d,0ms)}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  /* Reduced motion must not mean reduced CONTENT. Without this, every .rv
     block stays at opacity 0 forever and the page is blank for exactly the
     people who asked for less movement. */
  .js .rv{opacity:1!important;transform:none!important;transition-delay:0ms!important}
}
</style>
