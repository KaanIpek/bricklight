<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>West Tire and Auto Repair — Tires & Honest Auto Repair in Myrtle Beach, SC</title>
<meta name="description" content="Family-run tire shop and auto repair in Myrtle Beach, SC. Tires, brakes, clutches, wheel hubs and honest diagnostics. 660+ five-star reviews. Call (843) 945-4869.">
<style>
  :root{
    --ink:#1a1d21; --panel:#23272e; --amber:#f5a623; --amber-dk:#d98c0a;
    --paper:#faf8f4; --mut:#8b93a1; --line:#e5e1d8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6}
  img{max-width:100%}
  a{color:inherit}

  /* Top bar */
  .topbar{background:var(--ink);color:#fff;font-size:.85rem;padding:.45rem 1.5rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .topbar b{color:var(--amber)}
  nav{position:sticky;top:0;background:#fffdf9;border-bottom:1px solid var(--line);z-index:50;display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.5rem}
  .logo{font-weight:800;font-size:1.15rem;letter-spacing:.5px}
  .logo span{color:var(--amber-dk)}
  nav ul{display:flex;gap:1.4rem;list-style:none;font-size:.92rem;font-weight:600}
  nav ul a{text-decoration:none;color:#444}
  nav ul a:hover{color:var(--amber-dk)}
  .call-btn{background:var(--amber);color:var(--ink);font-weight:800;padding:.55rem 1.1rem;border-radius:6px;text-decoration:none;white-space:nowrap;box-shadow:0 2px 0 var(--amber-dk)}
  .call-btn:hover{transform:translateY(-1px)}
  @media(max-width:760px){nav ul{display:none}}

  /* Hero */
  header.hero{background:
    radial-gradient(1200px 500px at 80% -10%, rgba(245,166,35,.22), transparent 60%),
    linear-gradient(160deg,#1a1d21 0%,#23272e 55%,#2c313a 100%);
    color:#fff;padding:5rem 1.5rem 6.5rem;position:relative;overflow:hidden}
  .hero-inner{max-width:1040px;margin:0 auto;position:relative;z-index:2}
  .kicker{display:inline-block;background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.5);color:var(--amber);font-weight:700;font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase;padding:.35rem .9rem;border-radius:99px;margin-bottom:1.2rem}
  .hero h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.12;font-weight:800;max-width:640px}
  .hero h1 em{color:var(--amber);font-style:normal}
  .hero p.lead{margin:1.2rem 0 2rem;max-width:520px;color:#c8cdd6;font-size:1.08rem}
  .hero-ctas{display:flex;gap:.9rem;flex-wrap:wrap}
  .btn-primary{background:var(--amber);color:var(--ink);font-weight:800;padding:.85rem 1.6rem;border-radius:8px;text-decoration:none;font-size:1.05rem;box-shadow:0 3px 0 var(--amber-dk)}
  .btn-ghost{border:1.5px solid #58606c;color:#e8eaee;font-weight:600;padding:.85rem 1.5rem;border-radius:8px;text-decoration:none}
  .btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
  .hero .tread{position:absolute;right:-140px;top:-140px;width:520px;height:520px;border-radius:50%;border:60px solid rgba(255,255,255,.045);z-index:1}
  .hero .tread2{position:absolute;right:-40px;top:180px;width:300px;height:300px;border-radius:50%;border:40px dashed rgba(245,166,35,.13);z-index:1}

  /* Stats strip */
  .stats{max-width:1040px;margin:-3.2rem auto 0;position:relative;z-index:5;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 14px 34px rgba(26,29,33,.12)}
  .stat{background:#fffdf9;padding:1.3rem 1rem;text-align:center}
  .stat b{display:block;font-size:1.7rem;color:var(--amber-dk)}
  .stat span{font-size:.85rem;color:#666;font-weight:600}

  section{padding:4.5rem 1.5rem}
  .wrap{max-width:1040px;margin:0 auto}
  h2.sec{font-size:2rem;font-weight:800;margin-bottom:.6rem}
  p.sub{color:#667;max-width:560px;margin-bottom:2.4rem}
  .accent{width:56px;height:5px;background:var(--amber);border-radius:3px;margin-bottom:1.1rem}

  /* Services */
  .svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.1rem}
  .svc{background:#fffdf9;border:1px solid var(--line);border-radius:12px;padding:1.5rem;transition:.18s}
  .svc:hover{border-color:var(--amber);box-shadow:0 8px 22px rgba(245,166,35,.14);transform:translateY(-3px)}
  .svc .ic{width:46px;height:46px;border-radius:10px;background:linear-gradient(140deg,var(--amber),var(--amber-dk));display:flex;align-items:center;justify-content:center;margin-bottom:1rem;font-size:1.35rem}
  .svc h3{font-size:1.05rem;margin-bottom:.4rem}
  .svc p{font-size:.9rem;color:#667}

  /* Why us */
  .why{background:var(--ink);color:#fff}
  .why .wrap{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center}
  @media(max-width:820px){.why .wrap{grid-template-columns:1fr}}
  .why h2{color:#fff}
  .why p.sub{color:#9aa2ae}
  .tick{display:flex;gap:.8rem;margin-bottom:1.05rem;align-items:flex-start}
  .tick .tk{min-width:26px;height:26px;border-radius:50%;background:var(--amber);color:var(--ink);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:.85rem;margin-top:.15rem}
  .tick b{display:block}
  .tick span{color:#9aa2ae;font-size:.92rem}
  .why-card{background:linear-gradient(160deg,#2c313a,#23272e);border:1px solid #3a404b;border-radius:16px;padding:2.2rem;text-align:center}
  .why-card .big{font-size:4rem;font-weight:900;color:var(--amber);line-height:1}
  .why-card .stars{color:var(--amber);font-size:1.5rem;letter-spacing:3px;margin:.4rem 0}
  .why-card p{color:#9aa2ae;font-size:.95rem}

  /* Reviews */
  .rev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.2rem}
  .rev{background:#fffdf9;border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:10px;padding:1.5rem}
  .rev .stars{color:var(--amber-dk);letter-spacing:2px;margin-bottom:.6rem}
  .rev p{font-size:.95rem;color:#444;font-style:italic}
  .rev footer{margin-top:.9rem;font-size:.85rem;font-weight:700;color:#888}
  .gbadge{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.6rem;font-size:.9rem;color:#666;border:1px solid var(--line);padding:.55rem 1rem;border-radius:99px;background:#fff}

  /* Visit */
  .visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem;align-items:start}
  @media(max-width:820px){.visit .wrap{grid-template-columns:1fr}}
  .info-card{background:#fffdf9;border:1px solid var(--line);border-radius:14px;padding:1.8rem}
  .info-row{display:flex;gap:.9rem;padding:.75rem 0;border-bottom:1px dashed var(--line);font-size:.97rem}
  .info-row:last-child{border-bottom:none}
  .info-row .lbl{min-width:92px;font-weight:700;color:var(--amber-dk)}
  .hours td{padding:.2rem .6rem .2rem 0;font-size:.95rem}
  .hours .closed{color:#b66}
  iframe.map{width:100%;height:360px;border:0;border-radius:14px;box-shadow:0 10px 26px rgba(26,29,33,.14)}

  /* CTA + footer */
  .cta{background:linear-gradient(140deg,var(--amber),var(--amber-dk));text-align:center}
  .cta h2{font-size:2rem;font-weight:900}
  .cta p{margin:.6rem 0 1.6rem;color:#4d3a09}
  .cta a{background:var(--ink);color:#fff;font-weight:800;padding:.9rem 2rem;border-radius:8px;text-decoration:none;font-size:1.1rem}
  footer.site{background:var(--ink);color:#8b93a1;text-align:center;padding:2rem 1.5rem;font-size:.85rem}
  footer.site b{color:#fff}
  @media(max-width:520px){nav{flex-wrap:wrap;gap:.6rem;justify-content:center}nav .logo{width:100%;text-align:center}}
</style>

<style>
  .bl-watermark{position:fixed;inset:-50%;z-index:9998;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='300'><text x='0' y='150' font-family='Arial' font-size='30' font-weight='bold' fill='rgba(120,120,120,0.16)' transform='rotate(-27 210 150)'>DEMO PREVIEW — BRICKLIGHT STUDIO</text></svg>");
    background-repeat:repeat}
  .bl-banner{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#111;color:#fff;
    font-family:'Segoe UI',system-ui,sans-serif;font-size:.9rem;padding:.7rem 1rem;text-align:center;
    box-shadow:0 -4px 18px rgba(0,0,0,.35)}
  .bl-banner b{color:#f5c26b}
  body{user-select:none;-webkit-user-select:none}
  .bl-expired{position:fixed;inset:0;z-index:10000;background:rgba(12,12,14,.96);color:#fff;

  .bl-expired p{color:#aaa;max-width:420px}
</style>
