<style>
  :root{
    --navy:#0e2a3a; --navy2:#123648; --teal:#19b3a6; --teal-dk:#0e8a80;
    --bg:#f5f9f8; --ink:#17323f; --mut:#5c7480; --line:#dde8e6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:var(--bg);line-height:1.65}
  .sans{font-family:'Segoe UI',system-ui,sans-serif}
  a{color:inherit}

  nav{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.5rem}
  .logo{font-weight:700;font-size:1.2rem;letter-spacing:.3px}
  .logo .tag{display:block;font-size:.72rem;color:var(--teal);letter-spacing:2.5px;text-transform:uppercase;font-family:'Segoe UI',sans-serif}
  nav ul{display:flex;gap:1.5rem;list-style:none;font-size:.95rem}
  nav ul a{text-decoration:none;color:#cfe0e8}
  nav ul a:hover{color:var(--teal)}
  .call-btn{background:var(--teal);color:#04231f;font-weight:700;padding:.55rem 1.2rem;border-radius:99px;text-decoration:none;font-family:'Segoe UI',sans-serif;white-space:nowrap}
  @media(max-width:760px){nav ul{display:none}}

  header.hero{background:linear-gradient(rgba(14,42,58,.88),rgba(14,42,58,.94)),
    repeating-linear-gradient(45deg,#123648 0 22px,#0e2a3a 22px 44px);
    color:#fff;text-align:center;padding:5.5rem 1.5rem}
  .hero .fam{display:inline-block;border:1px solid var(--teal);color:var(--teal);border-radius:99px;padding:.35rem 1.1rem;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;font-family:'Segoe UI',sans-serif;margin-bottom:1.4rem}
  .hero h1{font-size:clamp(2.1rem,5vw,3.4rem);max-width:760px;margin:0 auto;line-height:1.15;font-weight:700}
  .hero h1 em{color:var(--teal);font-style:italic}
  .hero p{max-width:560px;margin:1.3rem auto 2.2rem;color:#b9cdd8;font-size:1.1rem}
  .btn-primary{display:inline-block;background:var(--teal);color:#04231f;font-weight:700;padding:.9rem 2rem;border-radius:99px;text-decoration:none;font-size:1.05rem;font-family:'Segoe UI',sans-serif}
  .btn-primary:hover{background:#25c9bb}
  .hero .sub-cta{display:block;margin-top:1rem;color:#9fb7c2;font-size:.9rem;font-family:'Segoe UI',sans-serif}

  .ribbon{background:var(--teal);color:#04231f;text-align:center;padding:.7rem 1rem;font-family:'Segoe UI',sans-serif;font-weight:700;font-size:.95rem}

  section{padding:4.5rem 1.5rem}
  .wrap{max-width:1000px;margin:0 auto}
  h2.sec{font-size:2.1rem;margin-bottom:.5rem}
  h2.sec::after{content:"";display:block;width:64px;height:4px;background:var(--teal);border-radius:2px;margin-top:.7rem}
  p.sub{color:var(--mut);max-width:600px;margin:1.1rem 0 2.3rem}

  .story{display:grid;grid-template-columns:1.2fr .8fr;gap:2.8rem;align-items:center}
  @media(max-width:820px){.story{grid-template-columns:1fr}}
  .story-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:2rem;box-shadow:6px 6px 0 var(--teal)}
  .story-card h3{font-size:1.2rem;margin-bottom:.6rem}
  .story-card p{font-size:.98rem;color:var(--mut)}
  .price-compare{margin-top:1.4rem;background:var(--navy);color:#fff;border-radius:4px;padding:1.2rem 1.4rem;font-family:'Segoe UI',sans-serif}
  .price-compare .row{display:flex;justify-content:space-between;padding:.35rem 0;font-size:.95rem}
  .price-compare .them s{color:#ff9b8a}
  .price-compare .us b{color:var(--teal);font-size:1.15rem}
  .price-compare .note{font-size:.75rem;color:#9fb7c2;margin-top:.5rem}

  .svc-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
  .svc{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1.4rem;display:flex;gap:1rem;align-items:flex-start}
  .svc .n{font-family:'Segoe UI',sans-serif;font-weight:800;color:var(--teal-dk);font-size:1.5rem;line-height:1}
  .svc h3{font-size:1.05rem;margin-bottom:.3rem}
  .svc p{font-size:.9rem;color:var(--mut)}

  .rev-band{background:var(--navy);color:#fff}
  .rev-band h2.sec{color:#fff}
  .rev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.2rem}
  .rev{background:var(--navy2);border-radius:4px;padding:1.7rem;position:relative}
  .rev::before{content:"“";position:absolute;top:.4rem;left:1.1rem;font-size:3.4rem;color:var(--teal);opacity:.55;font-family:Georgia,serif}
  .rev p{font-style:italic;color:#d7e4ea;font-size:.98rem;padding-top:1.1rem}
  .rev footer{margin-top:1rem;font-family:'Segoe UI',sans-serif;font-size:.85rem;color:var(--teal)}
  .stars{color:#ffc94d;letter-spacing:2px}

  .visit-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.2rem}
  @media(max-width:820px){.visit-grid{grid-template-columns:1fr}}
  .vcard{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1.8rem;font-family:'Segoe UI',sans-serif}
  .vrow{display:flex;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--line);font-size:.97rem}
  .vrow:last-child{border:none}
  .vrow .l{min-width:90px;font-weight:700;color:var(--teal-dk)}
  iframe.map{width:100%;height:340px;border:0;border-radius:4px}

  footer.site{background:var(--navy);color:#8fa9b6;text-align:center;padding:2.2rem 1.5rem;font-size:.85rem;font-family:'Segoe UI',sans-serif}
  footer.site b{color:#fff}
  @media(max-width:520px){nav{flex-wrap:wrap;gap:.6rem;justify-content:center}nav .logo{width:100%;text-align:center}}
</style>

    document.body.appendChild(d);
  }
  ['contextmenu','selectstart','copy','cut','dragstart'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {capture:true});
  });
  window.addEventListener('beforeprint', function(){ document.body.style.visibility='hidden'; });
  window.addEventListener('afterprint', function(){ document.body.style.visibility=''; });
  setInterval(function(){
    var open = (window.outerWidth - window.innerWidth > 160) || (window.outerHeight - window.innerHeight > 160);
    var o = document.getElementById('bl-dt');
    if (open && !o) { o=document.createElement('div'); o.id='bl-dt'; o.className='bl-expired';
      o.innerHTML='<h1>🔒 Preview paused</h1><p>Developer tools are disabled on this preview. Close them to continue viewing, or contact Bricklight Studio for a live walkthrough.</p>'; document.body.appendChild(o); }
    if (!open && o) { o.remove(); }
  }, 800);
  document.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ['s','u','p','a','c','i','j'].indexOf(k) !== -1) { e.preventDefault(); }
    if (e.key === 'F12') { e.preventDefault(); }
  }, {capture:true});
})();
</script>
