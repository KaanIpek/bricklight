<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Southern Grill — Burgers, Wraps &amp; Salads at Broadway at the Beach, Myrtle Beach SC</title>
<meta name="description" content="Southern Grill at Broadway at the Beach, Myrtle Beach. Burgers, philly steaks, wraps, fresh salads and smoothies. 4.6 stars from 2,100+ Google reviews. Open daily 11 AM–10:30 PM. Call (843) 251-5638.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --char:#1c1714; --char2:#272019; --rust:#d1461f; --rust-dk:#a83515;
  --amber:#f0a52c; --cream:#fdf8f0; --cream2:#f6ecdd; --line:#e6d8c4;
  --ink:#2b241e; --mut:#7d7066; --green:#3f7d4e;
  --fd:'Bebas Neue',Impact,sans-serif; --fs:'Fraunces',Georgia,serif; --fb:'Figtree','Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:var(--fb);background:var(--cream);color:var(--ink);line-height:1.6;overflow-x:clip;padding-bottom:64px}
a{color:inherit}
img,svg{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.25rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar */
.ribbon{background:var(--char);color:#f4e6cf;font-size:.82rem;padding:.4rem 0;font-weight:600}
.ribbon .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.ribbon b{color:var(--amber)}
.open-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:.35rem;box-shadow:0 0 8px #4ade80}

nav{position:sticky;top:0;z-index:60;background:rgba(253,248,240,.96);backdrop-filter:blur(8px);border-bottom:2px solid var(--char);}
.nav-in{max-width:1080px;margin:0 auto;padding:.6rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.logo .mark{width:38px;height:38px;border-radius:9px;background:var(--rust);display:flex;align-items:center;justify-content:center;flex:none}
.logo .mark svg{width:22px;height:22px}
.logo .txt{font-family:var(--fd);font-size:1.45rem;letter-spacing:1.6px;line-height:.95;color:var(--char)}
.logo .txt small{display:block;font-family:var(--fb);font-size:.54rem;letter-spacing:2.6px;color:var(--mut);font-weight:700;margin-top:2px}
nav ul{display:flex;gap:1.35rem;list-style:none;font-weight:700;font-size:.9rem}
nav ul a{text-decoration:none;color:#4a3f36}
nav ul a:hover{color:var(--rust)}
.nav-cta{display:flex;gap:.45rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font-weight:800;text-decoration:none;border-radius:9px;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:17px;height:17px;flex:none}
.btn-call{background:var(--rust);color:#fff;padding:.55rem 1rem;font-size:.9rem;box-shadow:0 3px 0 var(--rust-dk)}
.btn-order{background:var(--char);color:var(--amber);padding:.55rem 1rem;font-size:.9rem}
@media(max-width:900px){nav ul{display:none}}
@media(max-width:520px){.btn-order .t,.btn-call .t{display:none}.btn-call,.btn-order{padding:.55rem .75rem}}

/* ---------- hero */
header.hero{position:relative;background:
  radial-gradient(760px 420px at 78% 12%, rgba(240,165,44,.22), transparent 62%),
  linear-gradient(168deg,var(--char) 0%,var(--char2) 62%,#332a21 100%);
  color:#fff;padding:3.4rem 0 4.6rem;overflow:hidden}
header.hero::after{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 9px)}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:3rem;align-items:center;position:relative;z-index:2}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:2.2rem}}
.place{display:inline-flex;align-items:center;gap:.5rem;background:rgba(240,165,44,.14);border:1px solid rgba(240,165,44,.5);
  color:var(--amber);font-weight:800;font-size:.76rem;letter-spacing:1.4px;text-transform:uppercase;padding:.4rem 1rem;border-radius:99px;margin-bottom:1.2rem}
h1{font-family:var(--fd);font-size:clamp(3rem,8.5vw,5.4rem);line-height:.9;letter-spacing:1.5px;color:#fff}
h1 span{display:block;color:var(--amber)}
.tagline{font-family:var(--fs);font-size:clamp(1.05rem,2.2vw,1.32rem);color:#e6d5bd;margin-top:1.1rem;max-width:460px;font-weight:600}
.hero-ctas{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:2rem}
.btn-lg{padding:.95rem 1.7rem;font-size:1.04rem;border-radius:11px}
.btn-amber{background:var(--amber);color:var(--char);box-shadow:0 4px 0 #c8841c}
.btn-ghost{border:1.5px solid #5c4f42;color:#f0e5d4}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
.hero-meta{margin-top:1.5rem;color:#b6a794;font-size:.88rem;display:flex;gap:1.2rem;flex-wrap:wrap}
.hero-meta b{color:#f0e5d4}

/* review medallion */
.medal{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.16);
  border-radius:22px;padding:2rem 1.6rem;text-align:center;backdrop-filter:blur(3px);position:relative}
.medal .num{font-family:var(--fd);font-size:5rem;line-height:.85;color:var(--amber);letter-spacing:1px}
.medal .stars{color:var(--amber);font-size:1.35rem;letter-spacing:4px;margin:.5rem 0 .3rem}
.medal .cnt{font-weight:800;color:#fff;font-size:1.02rem}
.medal .lbl{color:#b6a794;font-size:.86rem;margin-top:.15rem}
.medal .rule{height:1px;background:rgba(255,255,255,.14);margin:1.15rem 0}
.medal .quote{font-family:var(--fs);font-style:italic;color:#e6d5bd;font-size:.95rem;line-height:1.5}
.medal .who{color:#9d8f7d;font-size:.78rem;margin-top:.5rem;font-weight:700;letter-spacing:.4px}

/* ---------- strip */
.facts{background:var(--char);border-top:1px solid rgba(255,255,255,.07);padding:1rem 0}
.facts .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:#b6a794;font-size:.88rem;font-weight:600}
.facts b{color:var(--amber)}
.facts span{display:flex;align-items:center;gap:.45rem}
.facts svg{width:16px;height:16px;flex:none;color:var(--amber)}

/* ---------- sections */
section{padding:4.2rem 0}
.eyebrow{color:var(--rust);letter-spacing:2.6px;text-transform:uppercase;font-size:.75rem;font-weight:800;display:block;margin-bottom:.55rem}
h2{font-family:var(--fd);font-size:clamp(2.1rem,5vw,3rem);letter-spacing:1.2px;line-height:1;color:var(--char)}
.sub{color:var(--mut);max-width:560px;margin-top:.75rem;font-size:1rem}

/* ---------- menu */
.menu{background:var(--cream2)}
.menu-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1.4rem;flex-wrap:wrap;margin-bottom:1.6rem}
.tabs{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1.8rem}
.tab{border:1.5px solid var(--line);background:#fff;color:#5f5347;font-weight:700;font-size:.86rem;
  padding:.5rem 1rem;border-radius:99px;cursor:pointer;transition:.15s;font-family:var(--fb)}
.tab:hover{border-color:var(--rust);color:var(--rust)}
.tab[aria-selected="true"]{background:var(--char);color:var(--amber);border-color:var(--char)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.9rem 2.2rem}
.mi{display:flex;align-items:baseline;gap:.6rem;padding:.72rem 0;border-bottom:1px dotted #d8c8b1}
.mi .nm{font-weight:700;font-size:1rem;color:var(--ink)}
.mi .nm .hot{display:inline-block;background:var(--rust);color:#fff;font-size:.6rem;font-weight:800;letter-spacing:1px;
  padding:.12rem .4rem;border-radius:4px;vertical-align:middle;margin-left:.4rem;text-transform:uppercase}
.mi .dots{flex:1;border-bottom:1px dotted #cbb99f;transform:translateY(-4px);min-width:16px}
.mi .pr{font-family:var(--fd);font-size:1.22rem;color:var(--rust);letter-spacing:.5px;flex:none}
.mi .ds{display:block;font-weight:500;font-size:.83rem;color:var(--mut);margin-top:.12rem}
.menu-note{margin-top:1.6rem;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:.85rem 1.1rem;font-size:.87rem;color:var(--mut)}
.menu-note b{color:var(--ink)}

/* ---------- reviews */
.revs{background:var(--char);color:#fff}
.revs h2{color:#fff}
.revs .sub{color:#a2937f}
.rev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.1rem;margin-top:2.2rem}
.rev{background:var(--char2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:1.7rem;position:relative}
.rev .stars{color:var(--amber);letter-spacing:2px;margin-bottom:.75rem;font-size:.95rem}
.rev p{font-family:var(--fs);font-style:italic;color:#e0d1ba;font-size:1rem;line-height:1.55}
.rev footer{margin-top:1rem;color:#8d7f6d;font-size:.82rem;font-weight:700}
.gbar{margin-top:1.8rem;display:inline-flex;align-items:center;gap:.6rem;border:1px solid rgba(255,255,255,.16);
  border-radius:99px;padding:.6rem 1.2rem;color:#c9b99f;font-size:.88rem}
.gbar b{color:var(--amber)}

/* ---------- visit */
.visit-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.2rem;margin-top:2rem}
@media(max-width:860px){.visit-grid{grid-template-columns:1fr}}
.vcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.8rem}
.vrow{display:flex;gap:1rem;padding:.8rem 0;border-bottom:1px solid #f0e6d6;font-size:.97rem}
.vrow:last-child{border:none}
.vrow .l{min-width:96px;font-weight:800;color:var(--rust);font-size:.82rem;letter-spacing:1.2px;text-transform:uppercase;padding-top:.15rem}
.vrow a{font-weight:700}
.hrs{width:100%;font-size:.95rem}
.hrs td{padding:.16rem 0}
.hrs td:last-child{text-align:right;font-weight:700}
.today{color:var(--green);font-weight:800}
iframe.map{width:100%;height:100%;min-height:340px;border:0;border-radius:16px;box-shadow:0 10px 30px rgba(28,23,20,.16)}

/* ---------- cta */
.cta{background:linear-gradient(135deg,var(--rust),var(--rust-dk));color:#fff;text-align:center}
.cta h2{color:#fff}
.cta p{margin:.8rem auto 1.7rem;max-width:480px;color:#ffe3d6}
.cta .btn{background:var(--char);color:var(--amber);padding:1rem 2.1rem;font-size:1.08rem;border-radius:11px}

footer.site{background:var(--char);color:#8d7f6d;text-align:center;padding:2.4rem 1.25rem;font-size:.85rem}
footer.site b{color:#fff}
footer.site .fl{margin-top:.5rem}

/* ---------- sticky mobile bar */
.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:1fr 1fr;
  border-top:2px solid var(--char);box-shadow:0 -6px 20px rgba(28,23,20,.2)}
.stickybar a{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:1.05rem .5rem;
  font-weight:800;text-decoration:none;font-size:1rem}
.stickybar svg{width:19px;height:19px}
.sb-call{background:var(--rust);color:#fff}
.sb-order{background:var(--char);color:var(--amber)}
@media(min-width:901px){.stickybar{display:none}body{padding-bottom:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
