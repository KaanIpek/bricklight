<style>
:root{
  --char:#1c1714; --char2:#272019; --rust:#d1461f; --rust-dk:#a83515;
  --amber:#f0a52c; --cream:#fdf8f0; --cream2:#f6ecdd; --line:#e6d8c4;
  /* --mut was #7d7066: 4.53 on --cream and 4.10 on --cream2, so every muted
     line on a cream2 band (.ord-note, #faq .sub, #rnwLead, .rnw-hedge) failed
     WCAG AA. #6b5f55 measures 5.85 / 5.29. --rust stays the brand colour for
     FILLS; --rust-dk is the token for rust TEXT (6.24 on cream). */
  --ink:#2b241e; --mut:#6b5f55; --green:#3f7d4e;
  --fd:'Bebas Neue','Bebas Fallback',Impact,sans-serif;
  --fs:'Fraunces','Fraunces Fallback','Times New Roman',serif;
  --fb:'Figtree','Figtree Fallback',Arial,sans-serif;
}
/* Metric-matched fallbacks. size-adjust values were measured in-browser against
   the real webfont, so the text occupies the same box before and after the swap
   and the font load causes no layout shift. Do not "tidy" these numbers. */
@font-face{font-family:'Bebas Fallback';src:local('Arial'),local('Helvetica'),local('Roboto'),local('Liberation Sans');
  size-adjust:75%;ascent-override:130%;descent-override:22%;line-gap-override:0%}
@font-face{font-family:'Figtree Fallback';src:local('Arial'),local('Helvetica'),local('Roboto'),local('Liberation Sans');
  size-adjust:100%;ascent-override:96%;descent-override:24%;line-gap-override:0%}
/* Android ships none of Times New Roman / Liberation Serif / Georgia, so this
   face used to resolve to nothing there and the metric match did not apply on
   the one platform where the swap shift was measured at 129px. Noto Serif and
   Droid Serif are the Android system serifs. NOTE: size-adjust:97% was measured
   against Times New Roman — re-measure against Noto Serif with the canvas
   snippet in research-performance-a11y.md C4 before treating it as exact. */
@font-face{font-family:'Fraunces Fallback';src:local('Times New Roman'),local('Liberation Serif'),local('Georgia'),local('Noto Serif'),local('Droid Serif');
  size-adjust:97%;ascent-override:98%;descent-override:24%;line-gap-override:0%}
*{margin:0;padding:0;box-sizing:border-box}
/* scroll-padding-top clears the sticky nav (measured 65px once the header CTAs
   reached the 44px touch target) plus 13px of breathing room, so an in-page
   jump no longer lands with the section heading hidden behind the nav. */
html{scroll-behavior:smooth;scroll-padding-top:78px;-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:var(--fb);background:var(--cream);color:var(--ink);line-height:1.6;overflow-x:clip;padding-bottom:64px}
a{color:inherit}
img,svg{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.25rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.annc{background:var(--amber);color:var(--char);font-weight:800;text-align:center;padding:.6rem 1rem;font-size:.95rem}
/* When the bar arrives from the API AFTER first paint, showing it in flow
   pushes the whole document down ~44px, well outside any input window, so all
   of it counts toward CLS. Fixed-position elements are excluded from layout
   shift scoring — so a late bar is pinned instead of inserted. */
.annc.late{position:fixed;left:0;right:0;z-index:80;
  bottom:calc(64px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -4px 14px rgba(28,23,20,.25)}
@media(min-width:901px){.annc.late{bottom:0}}
.ribbon{background:var(--char);color:#f4e6cf;font-size:.82rem;padding:.4rem 0;font-weight:600}
.ribbon .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.ribbon b{color:var(--amber)}
.open-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:.35rem;box-shadow:0 0 8px #4ade80}
.open-dot.shut{background:#e0674f;box-shadow:0 0 8px #e0674f}

/* No backdrop-filter: at .98 opacity the blur is invisible, but it forces a GPU
   backdrop pass on a sticky element every scroll frame. */
/* SCOPED to .topbar. The bottom call/order bar is a <nav> too (it needs a
   landmark name), and a bare `nav` selector put top:0 on it as well: with
   bottom:0 already set that stretched a fixed element over the whole viewport
   and painted it cream. */
.topbar nav{position:sticky;top:0;z-index:60;background:rgba(253,248,240,.98);border-bottom:2px solid var(--char)}
.nav-in{max-width:1080px;margin:0 auto;padding:.6rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.logo .mark{width:38px;height:38px;border-radius:9px;background:var(--rust);display:flex;align-items:center;justify-content:center;flex:none}
.logo .mark svg{width:22px;height:22px}
.logo .txt{font-family:var(--fd);font-size:1.45rem;letter-spacing:1.6px;line-height:.95;color:var(--char)}
.logo .txt small{display:block;font-family:var(--fb);font-size:.54rem;letter-spacing:2.6px;color:var(--mut);font-weight:700;margin-top:2px}
.topbar nav ul{display:flex;gap:1.35rem;list-style:none;font-weight:700;font-size:.9rem}
.topbar nav ul a{text-decoration:none;color:#4a3f36}
.topbar nav ul a:hover{color:var(--rust-dk)}
.nav-cta{display:flex;gap:.45rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font-weight:800;text-decoration:none;border-radius:9px;transition:transform .15s,background .15s;border:0;cursor:pointer;font-family:var(--fb)}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:17px;height:17px;flex:none}
/* min-height/min-width 44: the one-handed usability target. Both cleared
   WCAG 2.2 SC 2.5.8's 24px already; ~35x41 was just uncomfortable while walking. */
.btn-call{background:var(--rust);color:#fff;padding:.55rem 1rem;font-size:.9rem;box-shadow:0 3px 0 var(--rust-dk);min-height:44px;min-width:44px}
.btn-order{background:var(--char);color:var(--amber);padding:.55rem 1rem;font-size:.9rem;min-height:44px;min-width:44px}
@media(max-width:900px){.topbar nav ul{display:none}}
@media(max-width:520px){.btn-order .t,.btn-call .t{display:none}.btn-call,.btn-order{padding:.55rem .75rem}}

header.hero{position:relative;background:
  radial-gradient(760px 420px at 78% 12%, rgba(240,165,44,.22), transparent 62%),
  linear-gradient(168deg,var(--char) 0%,var(--char2) 62%,#332a21 100%);
  color:#fff;padding:3.4rem 0 4.6rem;overflow:hidden}
header.hero::after{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 9px)}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:3rem;align-items:center;position:relative;z-index:2}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:2.2rem}}
.place{display:inline-flex;align-items:center;gap:.5rem;background:rgba(240,165,44,.14);border:1px solid rgba(240,165,44,.5);
  color:var(--amber);font-weight:800;font-size:.76rem;letter-spacing:1.4px;text-transform:uppercase;padding:.4rem 1rem;border-radius:99px;margin-bottom:1.2rem}
h1{font-family:var(--fd);font-size:clamp(3rem,8.5vw,5.4rem);line-height:.9;letter-spacing:1.5px;color:#fff}
h1 .gold{display:block;color:var(--amber)}
h1 .h1-kicker{display:flex;align-items:center;gap:.4rem;font-family:var(--fb);font-size:.72rem;font-weight:800;
  letter-spacing:1.2px;text-transform:uppercase;color:var(--amber);line-height:1.4;margin-bottom:.9rem}
h1 .h1-kicker svg{width:14px;height:14px;flex:none}
.tagline{font-family:var(--fs);font-size:clamp(1.05rem,2.2vw,1.32rem);color:#e6d5bd;margin-top:1.1rem;max-width:470px;font-weight:600}
.hero-ctas{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:2rem}
.btn-lg{padding:.95rem 1.7rem;font-size:1.04rem;border-radius:11px}
.btn-amber{background:var(--amber);color:var(--char);box-shadow:0 4px 0 #c8841c}
.btn-ghost{border:1.5px solid #5c4f42;color:#f0e5d4}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
.hero-meta{margin-top:1.5rem;color:#b6a794;font-size:.88rem;display:flex;gap:1.2rem;flex-wrap:wrap}
.hero-meta b{color:#f0e5d4}

/* No backdrop-filter here either — there is nothing behind the medal but a CSS
   gradient, so it was blurring a gradient at real GPU cost. */
.medal{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.16);
  border-radius:22px;padding:2rem 1.6rem;text-align:center}
.medal .num{font-family:var(--fd);font-size:5rem;line-height:.85;color:var(--amber);letter-spacing:1px}
.medal .stars{color:var(--amber);font-size:1.35rem;letter-spacing:4px;margin:.5rem 0 .3rem}
.medal .cnt{font-weight:800;color:#fff;font-size:1.02rem}
.medal .lbl{color:#b6a794;font-size:.86rem;margin-top:.15rem}
.medal .rule{height:1px;background:rgba(255,255,255,.14);margin:1.15rem 0}
.medal .quote{font-family:var(--fs);font-style:italic;color:#e6d5bd;font-size:.95rem;line-height:1.5}
.medal .who{color:#9d8f7d;font-size:.78rem;margin-top:.5rem;font-weight:700;letter-spacing:.4px}

.serve{background:var(--rust);color:#fff;padding:.9rem 0}
.serve .wrap{display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap}
.serve span{display:inline-flex;align-items:center;gap:.4rem;background:rgba(0,0,0,.16);border-radius:99px;
  padding:.4rem 1rem;font-weight:800;font-size:.88rem}
.serve svg{width:15px;height:15px}

.facts{background:var(--char);border-top:1px solid rgba(255,255,255,.07);padding:1rem 0}
.facts .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:#b6a794;font-size:.88rem;font-weight:600}
.facts b{color:var(--amber)}
.facts span{display:flex;align-items:center;gap:.45rem}
.facts svg{width:16px;height:16px;flex:none;color:var(--amber)}

section{padding:4.2rem 0}
/* --rust-dk, not --rust: 12px/800 needs 4.5:1 and --rust measures 4.31 on cream. */
.eyebrow{color:var(--rust-dk);letter-spacing:2.6px;text-transform:uppercase;font-size:.75rem;font-weight:800;display:block;margin-bottom:.55rem}
h2{font-family:var(--fd);font-size:clamp(2.1rem,5vw,3rem);letter-spacing:1.2px;line-height:1;color:var(--char)}
.sub{color:var(--mut);max-width:600px;margin-top:.75rem;font-size:1rem}

.loved-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.1rem;margin-top:2.2rem}
.loved{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.7rem;position:relative;overflow:hidden}
.loved::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rust)}
.loved .rank{font-family:var(--fd);font-size:1rem;letter-spacing:1.5px;color:var(--mut)}
.loved h3{font-family:var(--fd);font-size:2rem;letter-spacing:1px;color:var(--char);margin:.15rem 0 .5rem}
.loved .cnt{display:inline-flex;align-items:center;gap:.4rem;background:var(--cream2);border-radius:99px;
  padding:.3rem .8rem;font-weight:800;font-size:.82rem;color:var(--rust-dk)}
.loved p{color:var(--mut);font-size:.9rem;margin-top:.8rem}
.loved-note{margin-top:1.3rem;font-size:.85rem;color:var(--mut)}

/* order platforms */
.order-band{background:var(--cream2)}
.ord-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-top:2rem}
.ord{display:flex;align-items:center;gap:.9rem;background:#fff;border:1.5px solid var(--line);border-radius:14px;
  padding:1.2rem 1.3rem;text-decoration:none;transition:.16s}
.ord:hover{border-color:var(--rust);transform:translateY(-3px);box-shadow:0 10px 24px rgba(28,23,20,.1)}
.ord .badge{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:1.5rem;color:#fff;flex:none;letter-spacing:.5px}
.ord.clover .badge{background:var(--rust)}
.ord.doordash .badge{background:#ff3008}
.ord.grubhub .badge{background:#f63440}
.ord.ubereats .badge{background:#06c167}
.ord .t1{display:block;font-weight:800;font-size:1.02rem;line-height:1.25}
.ord .t2{display:block;font-size:.82rem;color:var(--mut)}
.ord-note{margin-top:1.2rem;font-size:.86rem;color:var(--mut)}

.menu{background:var(--cream)}
.menu-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1.4rem;flex-wrap:wrap;margin-bottom:1.6rem}
.tabs{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1.8rem}
.tab{border:1.5px solid var(--line);background:#fff;color:#5f5347;font-weight:700;font-size:.86rem;
  padding:.5rem 1rem;border-radius:99px;cursor:pointer;transition:.15s;font-family:var(--fb);
  min-height:44px;display:inline-flex;align-items:center}
.tab:hover{border-color:var(--rust);color:var(--rust-dk)}
/* These are filter toggles, not tabs (there is no tabpanel to move to), so the
   selected state is aria-pressed. The [aria-selected] rule is kept so a cached
   or half-updated render still highlights correctly. */
.tab[aria-pressed="true"],.tab[aria-selected="true"]{background:var(--char);color:var(--amber);border-color:var(--char)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.9rem 2.2rem}
.mi{display:flex;align-items:baseline;gap:.6rem;padding:.72rem 0;border-bottom:1px dotted #d8c8b1}
.mi .nm{font-weight:700;font-size:1rem;color:var(--ink)}
.mi .nm .hot{display:inline-block;background:var(--rust);color:#fff;font-size:.6rem;font-weight:800;letter-spacing:1px;
  padding:.12rem .4rem;border-radius:4px;vertical-align:middle;margin-left:.4rem;text-transform:uppercase}
.mi .dots{flex:1;border-bottom:1px dotted #cbb99f;transform:translateY(-4px);min-width:16px}
/* Bebas 1.22rem ~= 19.5px at weight 400 — under the 24px large-text threshold,
   so prices need 4.5:1. --rust was 4.31 on cream; --rust-dk is 6.24. */
.mi .pr{font-family:var(--fd);font-size:1.22rem;color:var(--rust-dk);letter-spacing:.5px;flex:none}
.mi .pr.ask{font-size:.85rem;font-family:var(--fb);font-weight:800;color:var(--mut)}
.mi .ds{display:block;font-weight:500;font-size:.83rem;color:var(--mut);margin-top:.12rem}
.menu-note{margin-top:1.6rem;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:.85rem 1.1rem;font-size:.87rem;color:var(--mut)}
.menu-note b{color:var(--ink)}

.gtk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1rem;margin-top:2rem}
.gtk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.4rem}
.gtk .ic{width:40px;height:40px;border-radius:10px;background:var(--cream2);display:flex;align-items:center;justify-content:center;margin-bottom:.85rem}
.gtk .ic svg{width:20px;height:20px;color:var(--rust)}
.gtk h3{font-size:1rem;margin-bottom:.3rem}
.gtk p{font-size:.87rem;color:var(--mut)}

.revs{background:var(--char);color:#fff}
.revs h2{color:#fff}
.revs .sub{color:#a2937f}
.rev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.1rem;margin-top:2.2rem}
.rev{background:var(--char2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:1.7rem}
.rev .stars{color:var(--amber);letter-spacing:2px;margin-bottom:.75rem;font-size:.95rem}
.rev p{font-family:var(--fs);font-style:italic;color:#e0d1ba;font-size:1rem;line-height:1.55}
/* #8d7f6d on --char2 measured 4.12; #a2937f is 5.37. */
.rev footer{margin-top:1rem;color:#a2937f;font-size:.82rem;font-weight:700}
.gbar{margin-top:1.8rem;display:inline-flex;align-items:center;gap:.6rem;border:1px solid rgba(255,255,255,.16);
  border-radius:99px;padding:.6rem 1.2rem;color:#c9b99f;font-size:.88rem}
.gbar b{color:var(--amber)}

.visit-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.2rem;margin-top:2rem}
@media(max-width:860px){.visit-grid{grid-template-columns:1fr}}
.vcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.8rem}
.vrow{display:flex;gap:1rem;padding:.8rem 0;border-bottom:1px solid #f0e6d6;font-size:.97rem}
.vrow:last-child{border:none}
.vrow .l{min-width:96px;font-weight:800;color:var(--rust);font-size:.82rem;letter-spacing:1.2px;text-transform:uppercase;padding-top:.15rem}
/* underline, not weight alone: a{color:inherit} means the phone link is
   otherwise indistinguishable from body text. The padding lifts a ~19px inline
   target toward 44px. */
.vrow a{font-weight:700;display:inline-block;padding:.35rem 0;text-decoration:underline;text-underline-offset:3px}
.hrs{width:100%;font-size:.95rem}
.hrs td{padding:.16rem 0}
/* The day column is a row header. font-weight:400 keeps the visual output
   identical to the <td> it replaced. */
.hrs th{font-weight:400;text-align:left;padding:.16rem 0}
.hrs td:last-child{text-align:right;font-weight:700}
.today{color:var(--green);font-weight:800}
iframe.map{width:100%;height:100%;min-height:340px;border:0;border-radius:16px;box-shadow:0 10px 30px rgba(28,23,20,.16)}

.cta{background:linear-gradient(135deg,var(--rust),var(--rust-dk));color:#fff;text-align:center}
.cta h2{color:#fff}
/* #ffe3d6 on the rust gradient measured 3.73; plain white is 4.56 at the light
   end of the gradient and 6.6 at the dark end, and leaves the brand colour alone. */
.cta p{margin:.8rem auto 1.7rem;max-width:480px;color:#fff}
.cta .btn{background:var(--char);color:var(--amber);padding:1rem 2.1rem;font-size:1.08rem;border-radius:11px}

footer.site{background:var(--char);color:#8d7f6d;text-align:center;padding:2.4rem 1.25rem;font-size:.85rem}
footer.site b{color:#fff}
footer.site .fl{margin-top:.5rem}
footer.site .adm{display:inline-block;margin-top:1.1rem;color:#3d352d;text-decoration:none;font-size:.72rem;letter-spacing:1px}
footer.site .adm:hover{color:var(--amber)}

.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:1fr 1fr;
  border-top:2px solid var(--char);box-shadow:0 -6px 20px rgba(28,23,20,.2)}
.stickybar a{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:1.05rem .5rem;
  font-weight:800;text-decoration:none;font-size:1rem}
.stickybar svg{width:19px;height:19px}
.sb-call{background:var(--rust);color:#fff}
.sb-order{background:var(--char);color:var(--amber)}
@media(min-width:901px){.stickybar{display:none}body{padding-bottom:0}}

.medal .src{color:#9d8f7d;font-size:.72rem;margin-top:.45rem;letter-spacing:.3px}

/* ---- FAQ ---- */
.faq-list{margin-top:2rem;display:grid;gap:.7rem}

.faq h3{margin:0}
.faq h3 button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:1rem;
  background:none;border:0;cursor:pointer;text-align:left;font-family:var(--fb);font-weight:800;
  font-size:1rem;color:var(--ink);padding:1.05rem 1.25rem;line-height:1.35}
.faq h3 button:hover{color:var(--rust)}
.faq h3 button:focus-visible{outline:3px solid var(--rust);outline-offset:-3px}
.faq .mk{flex:none;width:22px;height:22px;border-radius:50%;background:var(--cream2);color:var(--rust);
  display:flex;align-items:center;justify-content:center;font-size:1.05rem;line-height:1;transition:transform .18s}
.faq h3 button[aria-expanded="true"] .mk{transform:rotate(45deg)}
.faq .ans{padding:0 1.25rem 1.15rem;color:var(--mut);font-size:.93rem;margin:0}

footer.site .adm:focus-visible{color:var(--amber);outline:3px solid var(--amber);outline-offset:3px}

/* ---- Right Now Board ----
   TWO reservations, not one. #rnbCard ships `hidden` (= display:none, zero
   height), so a min-height on .rnb cannot hold the space before JS unhides it —
   the reserve has to sit on .rnb-band>.wrap, which is always in flow. The .rnb
   min-height then keeps the card itself the same height in all five clock
   states, so the 30-second tick that flips before-open -> open -> last-call ->
   closed never moves the page below it. Both numbers are the MEASURED tallest
   state per breakpoint; re-measure if the board's copy or rows change. */
.rnb-band{background:var(--cream2);border-bottom:1px solid var(--line);padding:1.5rem 0 1.7rem}
/* THE RESERVE LIVES ON .rnb-slot, NOT ON THE CARD.
   Two things were wrong before. (1) #rnbCard shipped `hidden`, and a hidden
   element is display:none with zero height, so no min-height could hold its
   space - JS unhiding it moved everything below by 444px at 375px wide. The
   card is in flow from the markup now, seeded with the board's own no-clock
   state, which also gives crawlers and JS-off visitors the hours.
   (2) A min-height on .rnb-band>.wrap cannot work either: measured, that wrap
   holds the card AND the wayfinding block and is 633px tall on desktop, so a
   card-sized floor on it does nothing.
   So an empty slot wraps the card. The slot holds the MEASURED tallest state
   (which is open + a busy flag showing), the card sizes to its own content, and
   because the card is top-anchored nothing inside it and nothing below the slot
   ever moves - while a short state still looks like a short card rather than a
   tall one with 120px of blank in it. Re-measure both numbers if the board's
   copy or its rows change. */
.rnb-slot{min-height:331px}
.rnb{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:1.3rem 1.4rem;
  box-shadow:0 8px 22px rgba(28,23,20,.06);contain:layout style}
@media(max-width:560px){.rnb{padding:1.1rem 1.05rem}
  .rnb-slot{min-height:482px}}
.rnb-state{display:flex;align-items:center;gap:.45rem;font-weight:800;font-size:.76rem;
  letter-spacing:1.6px;text-transform:uppercase;color:var(--green)}
.rnb-state.shut{color:var(--rust-dk)}
.rnb-state .dot{width:8px;height:8px;border-radius:50%;background:#3f7d4e;flex:none}
.rnb-state.shut .dot{background:var(--rust-dk)}
.rnb-big{font-family:var(--fs);font-weight:700;line-height:1.25;color:var(--char);
  font-size:clamp(1.2rem,4.4vw,1.62rem);margin:.5rem 0 0}
.rnb-big .t{font-family:var(--fd);font-size:1.42em;letter-spacing:1px;color:var(--rust);
  line-height:1;white-space:nowrap}
.rnb-note{color:var(--mut);font-size:.88rem;margin-top:.4rem}
/* The three optional rows collapse to nothing between clock states. Reserving
   each one stops the card growing and shrinking under the tick. */
#rnbFlagWrap{min-height:34px}
.rnb-flag{display:inline-flex;align-items:center;gap:.5rem;background:var(--cream2);
  border:1px solid var(--line);border-radius:99px;padding:.3rem .8rem;font-weight:800;
  font-size:.82rem;color:var(--ink);margin-top:.65rem}

.rnb-cta{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.95rem}
.rnb-cta .btn{padding:.85rem 1.35rem;font-size:1rem;border-radius:11px}
.btn-primary{background:var(--rust);color:#fff;box-shadow:0 4px 0 var(--rust-dk);
  flex:1 1 240px;min-width:0}
.btn-second{background:#fff;border:1.5px solid var(--line);color:var(--char);
  box-shadow:none;flex:0 1 auto}
.btn-second:hover{border-color:var(--rust);color:var(--rust)}
.rnb-combo{margin-top:.7rem;font-size:.87rem;color:var(--mut);min-height:22px}
.rnb-combo b{color:var(--rust-dk)}

   but it goes transparent when the row is empty — a divider under nothing is a
   visual wart, and hiding the border instead of removing it keeps the reserve. */
.rnb-apps{margin-top:.85rem;padding-top:.7rem;border-top:1px solid #f0e6d6;min-height:34px;
  display:flex;gap:1.1rem;flex-wrap:wrap;font-size:.81rem;color:var(--mut);align-items:baseline}
.rnb-apps:empty{border-top-color:transparent}
.rnb-apps a{font-weight:700;color:#5f5347;text-decoration:underline;text-underline-offset:3px}
.rnb-apps a:hover{color:var(--rust)}

/* ---- wayfinding ---- */
.rnw{margin-top:1.15rem}
/* h2, not h3: this heading sits between the hero h1 and the first section h2,
   so an h3 here both skipped a level and then went backwards. The rule sets its
   own family/size/spacing/colour, so promoting it changes nothing visually. */
.rnw h2{font-family:var(--fd);font-size:1.55rem;letter-spacing:1px;color:var(--char)}
.rnw .lead{color:var(--mut);font-size:.9rem;margin-top:.1rem;max-width:640px}

  padding:.72rem .9rem;font-size:.9rem;color:#514639;line-height:1.5}

.rnw li .w{font-weight:800;color:var(--ink);white-space:nowrap}
.rnw details{margin-top:.55rem}
.rnw summary{cursor:pointer;font-weight:800;font-size:.86rem;color:var(--rust-dk);
  list-style:none;display:inline-block;padding:.2rem 0}
.rnw summary::-webkit-details-marker{display:none}
.rnw summary::after{content:" \25be"}
.rnw details[open] summary::after{content:" \25b4"}
.rnw-hedge{margin-top:.6rem;font-size:.83rem;color:var(--mut)}
.rnw-share{margin-top:.85rem}
.rnw-share .btn{padding:.65rem 1.1rem;font-size:.92rem}

/* html{scroll-behavior} must be its own selector — the `*` rule cannot carry it
   without also overriding every scroll container on the page. The page has ten
   in-page anchors including two in the board, so smooth scroll was the largest
   remaining motion source for a vestibular-sensitive visitor. */
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}}
